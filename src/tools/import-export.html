<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>bilibili 屏蔽设置 - 导入/导出</title>
    <style>
      :root {
        color-scheme: dark;
        --surface: #222222;
        --accent: #00a1d6;
        --text: #d3d3d3;
      }
      body {
        background-color: var(--surface);
        color: var(--text);
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        color: var(--accent);
      }
      textarea {
        width: 100%;
        height: 320px;
        background-color: #1a1a1a;
        color: var(--text);
        border: 1px dotted var(--accent);
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        padding: 8px;
        box-sizing: border-box;
      }
      .actions {
        margin-top: 12px;
        display: flex;
        gap: 12px;
      }
      button {
        background-color: #fb7299;
        border: 1px solid #fb7299;
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        padding: 6px 14px;
      }
      button.secondary {
        background-color: #3da9cc;
        border-color: #73c9e5;
      }
      #status {
        margin-top: 12px;
        min-height: 1.5em;
        color: #ffb86c;
      }
      .hint {
        color: #8a8a8a;
        font-size: 13px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>哔哩哔哩 - 屏蔽指定内容：导入 / 导出</h1>
      <p class="hint">
        迁移方法：Tampermonkey 仪表盘 → 脚本「储存」标签页 → 复制 <code>bilibili_config</code> 的 JSON
        值，粘贴到下方文本框后点击「导入」。导出可用于备份或在浏览器之间迁移。
      </p>
      <textarea id="data" placeholder="在此粘贴 bilibili_config JSON…"></textarea>
      <div class="actions">
        <button id="import">导入</button>
        <button id="export" class="secondary">导出当前设置</button>
      </div>
      <div id="status" role="status"></div>
    </main>
    <script src="import-export.js" type="module"></script>
  </body>
</html>
