<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture: 视频卡片（www）</title>
  </head>
  <body>
    <!-- v5.5 内置规则结构：div:has(> .bili-video-card)，文字选择器 tit/author，时长选择器 duration -->
    <div data-test="card-by-user">
      <div class="bili-video-card">
        <div class="bili-video-card__info--tit">正常标题一</div>
        <div class="bili-video-card__info--author">广告UP</div>
      </div>
    </div>
    <div data-test="card-by-keyword">
      <div class="bili-video-card">
        <div class="bili-video-card__info--tit">广告标题二</div>
        <div class="bili-video-card__info--author">正常UP</div>
      </div>
    </div>
    <div data-test="card-clean">
      <div class="bili-video-card">
        <div class="bili-video-card__info--tit">正常标题三</div>
        <div class="bili-video-card__info--author">正常UP</div>
      </div>
    </div>
    <div data-test="card-scoped">
      <div class="bili-video-card">
        <div class="bili-video-card__info--tit">含搜索专属词</div>
        <div class="bili-video-card__info--author">正常UP</div>
      </div>
    </div>
    <div data-test="card-play-scoped">
      <div class="bili-video-card">
        <div class="bili-video-card__info--tit">含播放专属词</div>
        <div class="bili-video-card__info--author">正常UP</div>
      </div>
    </div>
    <div data-test="card-short">
      <div class="bili-video-card">
        <div class="bili-video-card__info--tit">正常短视频</div>
        <div class="bili-video-card__info--author">正常UP</div>
        <span class="bili-video-card__stats__duration">0:30</span>
      </div>
    </div>
    <div data-test="card-long">
      <div class="bili-video-card">
        <div class="bili-video-card__info--tit">正常长视频</div>
        <div class="bili-video-card__info--author">正常UP</div>
        <span class="bili-video-card__stats__duration">12:05</span>
      </div>
    </div>
    <div class="custom-junk" data-test="custom-junk">垃圾横幅</div>
    <div class="custom-match-card" data-test="custom-match">
      <span class="custom-title">匹配词标题</span>
    </div>
    <!-- durationSelector 扩展点：时长文本在非叶子节点（启发式探测找不到，需规则指定选择器） -->
    <div class="dur-card" data-test="card-dursel">
      <span class="t">扩展点选择器卡片</span>
      <div class="dur">0:45<span class="x">×</span></div>
    </div>
    <div class="dur-card-nosel" data-test="card-nodursel">
      <span class="t">无时长选择器卡片</span>
      <div class="dur">0:40<span class="x">×</span></div>
    </div>
  </body>
</html>
