<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture: 视频卡片（www）</title>
  </head>
  <body>
    <div class="video-card-common" data-test="card-by-user">
      <a class="up">广告UP</a>
      <a class="title">正常标题一</a>
    </div>
    <div class="video-card-common" data-test="card-by-keyword">
      <a class="up">正常UP</a>
      <a class="title">广告标题二</a>
    </div>
    <div class="video-card-common" data-test="card-clean">
      <a class="up">正常UP</a>
      <a class="title">正常标题三</a>
    </div>
    <div class="video-card-common" data-test="card-scoped">
      <a class="up">正常UP</a>
      <a class="title">含搜索专属词</a>
    </div>
    <div class="video-card-common" data-test="card-short">
      <a class="up">正常UP</a>
      <a class="title">正常短视频</a>
      <span>0:30</span>
    </div>
    <div class="video-card-common" data-test="card-long">
      <a class="up">正常UP</a>
      <a class="title">正常长视频</a>
      <span>12:05</span>
    </div>
    <div class="groom-module" data-test="card-c1">
      <p class="author">up主：讨厌的UP</p>
      <p class="title">推荐模块</p>
    </div>
    <div class="storey-box">
      <div class="spread-module" data-test="card-c2-first">
        <a href="https://www.bilibili.com/video/BV1sp000001"></a>
        <p class="t">异步查询卡片一</p>
      </div>
      <div class="spread-module" data-test="card-c2-second">
        <a href="https://www.bilibili.com/video/BV1sp000002"></a>
        <p class="t">异步查询卡片二</p>
      </div>
    </div>
    <div class="custom-junk" data-test="custom-junk">垃圾横幅</div>
    <div class="custom-match-card" data-test="custom-match">
      <span class="custom-title">匹配词标题</span>
    </div>
    <!-- durationSelector 扩展点：时长文本在非叶子节点（启发式探测找不到，需规则指定选择器） -->
    <div class="dur-card" data-test="card-dursel">
      <span class="t">扩展点选择器卡片</span>
      <div class="dur">0:45<span class="x">×</span></div>
    </div>
    <div class="dur-card-nosel" data-test="card-nodursel">
      <span class="t">无时长选择器卡片</span>
      <div class="dur">0:40<span class="x">×</span></div>
    </div>
  </body>
</html>
